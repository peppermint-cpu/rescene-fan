=====================================================================
 설치 순서 (Supabase 무료 계정 + Render 정적 사이트)

 1. supabase.com 에서 새 프로젝트를 만든다.
 2. 왼쪽 메뉴 SQL Editor 에 아래 SQL 전체를 붙여 넣고 Run 한다.
 3. Project Settings > API 의 Project URL 과 anon public key 를
    아래 script 맨 위의 CFG 에 붙여 넣는다.
 4. (선택) Authentication > Providers > Email 에서 Confirm email 을 끄면
    가입 즉시 로그인된다. 켜 두면 인증 메일을 확인해야 한다.
 5. Authentication > URL Configuration 의 Site URL 에 Render 주소를 넣는다.
 6. 이 index.html 을 Render 의 Static Site 로 배포한다
    (Build Command 비움, Publish Directory 는 . ).
 7. 사이트에서 먼저 가입한 뒤, SQL Editor 에서 아래 한 줄로 관리자를 지정한다.
    update profiles set is_admin = true where id = (select id from auth.users where email = '내이메일');

=== SQL 시작 ===
create table profiles (
  id uuid primary key references auth.users on delete cascade,
  nick text not null unique check (char_length(nick) between 2 and 12),
  is_admin boolean not null default false,
  created_at timestamptz not null default now()
);
create table news (
  id bigint generated always as identity primary key,
  tag text not null, title text not null, body text not null, url text,
  date date not null default current_date
);
create table releases (
  id text primary key, title text not null, kind text not null,
  date date not null, dl text, note text, tracks text[] not null default '{}'
);
create table settings (key text primary key, value jsonb not null);
create table posts (
  id bigint generated always as identity primary key,
  user_id uuid not null default auth.uid() references profiles(id) on delete cascade,
  cat text not null,
  title text not null check (char_length(title) <= 60),
  body text not null check (char_length(body) <= 1500),
  created_at timestamptz not null default now()
);
create table comments (
  id bigint generated always as identity primary key,
  post_id bigint not null references posts(id) on delete cascade,
  user_id uuid not null default auth.uid() references profiles(id) on delete cascade,
  body text not null check (char_length(body) <= 300),
  created_at timestamptz not null default now()
);
create table likes (
  post_id bigint not null references posts(id) on delete cascade,
  user_id uuid not null default auth.uid() references profiles(id) on delete cascade,
  primary key (post_id, user_id)
);
create index on posts (created_at desc);
create index on comments (post_id);

create function is_admin() returns boolean language sql stable security definer set search_path = public
as $$ select coalesce((select is_admin from profiles where id = auth.uid()), false) $$;

create function handle_new_user() returns trigger language plpgsql security definer set search_path = public
as $$ begin
  insert into profiles (id, nick)
  values (new.id, coalesce(new.raw_user_meta_data->>'nick', 'fan' || substr(replace(new.id::text, '-', ''), 1, 8)));
  return new;
end $$;
create trigger on_auth_user_created after insert on auth.users
  for each row execute function handle_new_user();

create function delete_me() returns void language sql security definer set search_path = public
as $$ delete from auth.users where id = auth.uid() $$;
revoke execute on function delete_me() from public, anon;
grant execute on function delete_me() to authenticated;

alter table profiles enable row level security;
alter table news enable row level security;
alter table releases enable row level security;
alter table settings enable row level security;
alter table posts enable row level security;
alter table comments enable row level security;
alter table likes enable row level security;

create policy read_all on profiles for select using (true);
create policy read_all on news for select using (true);
create policy read_all on releases for select using (true);
create policy read_all on settings for select using (true);
create policy read_all on posts for select using (true);
create policy read_all on comments for select using (true);
create policy read_all on likes for select using (true);

create policy admin_write on news for all using (is_admin()) with check (is_admin());
create policy admin_write on releases for all using (is_admin()) with check (is_admin());
create policy admin_write on settings for all using (is_admin()) with check (is_admin());

create policy own_nick on profiles for update using (id = auth.uid()) with check (id = auth.uid());
revoke update on profiles from anon, authenticated;
grant update (nick) on profiles to authenticated;

create policy post_add on posts for insert with check (user_id = auth.uid());
create policy post_del on posts for delete using (user_id = auth.uid() or is_admin());
create policy comment_add on comments for insert with check (user_id = auth.uid());
create policy comment_del on comments for delete using (user_id = auth.uid() or is_admin());
create policy like_add on likes for insert with check (user_id = auth.uid());
create policy like_del on likes for delete using (user_id = auth.uid());

alter publication supabase_realtime add table news, releases, settings, posts, comments, likes, profiles;

</section>
<section id="p-music" hidden><div id="v-music"></div></section>
<section id="p-members" hidden><div id="v-members"></div></section>
<section id="p-board" hidden>
<form id="pf" class="box" hidden>
<label for="pc">분류<select id="pc" name="c"></select></label>
<label for="pt">제목<input id="pt" name="t" maxlength="60" required autocomplete="off"></label>
<label for="pb">내용<textarea id="pb" name="b" maxlength="1500" required></textarea></label>
<div class="btns"><button class="btn">등록</button><button type="button" class="btn g" data-a="write">취소</button></div>
</form>
<div id="v-board"></div>
</section>
</main>

<footer class="w">팬이 만든 비공식 사이트이며 더뮤즈엔터테인먼트 및 리센느와 관련이 없습니다. 소식은 공개된 기사를 바탕으로 정리해요.</footer>

<div id="sheet" hidden><div id="sp" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const CFG={url:'https://YOUR-PROJECT.supabase.co',key:'YOUR-ANON-KEY'};

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),
today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'}),
dd=d=>Math.round((Date.parse(d)-Date.parse(today()))/864e5),
fd=d=>String(d||'').replaceAll('-','.'),
rtf=new Intl.RelativeTimeFormat('ko',{numeric:'auto'}),
ago=t=>{const s=(t-Date.now())/1e3,a=Math.abs(s);return a<60?'방금 전':a<3600?rtf.format(Math.round(s/60),'minute'):a<86400?rtf.format(Math.round(s/3600),'hour'):a<604800?rtf.format(Math.round(s/86400),'day'):new Date(t).toLocaleDateString('ko')},
CATS=['컴백 응원','음악 이야기','자유','질문'],
TAGS=['컴백','음악방송','차트','프로모션','활동','공지'],
KIND={mini:['미니앨범','a'],sa:['싱글 앨범','a'],single:['디지털 싱글','s'],collab:['콜라보','s'],jp:['일본 싱글','j']},
MEM=[['Woni','원이'],['Liv','리브'],['Minami','미나미','일본 출신 멤버 · 지바'],['May','메이'],['Zena','제나']],
ROUTES=['home','news','music','members','board'],
NICK=/^[\w가-힣 ]{2,12}$/,
ERR=[[/Invalid login/i,'이메일 또는 비밀번호가 맞지 않아요.'],[/already registered/i,'이미 가입된 이메일이에요.'],[/Database error|23505|duplicate/i,'이미 사용 중인 닉네임이거나 형식이 올바르지 않아요.'],[/not confirmed/i,'이메일 인증을 먼저 완료해 주세요.'],[/Password should/i,'비밀번호는 6자 이상이어야 해요.'],[/rate limit|429/i,'요청이 많아요. 잠시 후 다시 시도해 주세요.'],[/row-level|42501|permission/i,'권한이 없어요.']],
Q={
news:()=>sb.from('news').select('*').order('date',{ascending:false}).order('id',{ascending:false}).limit(100),
releases:()=>sb.from('releases').select('*').order('date',{ascending:false}),
settings:()=>sb.from('settings').select('value').eq('key','hero').maybeSingle(),
posts:()=>sb.from('posts').select('id,cat,title,body,user_id,created_at,profiles(nick),likes(user_id),comments(id,body,user_id,created_at,profiles(nick))').order('created_at',{ascending:false}).limit(200),
profiles:()=>sb.from('profiles').select('*',{count:'exact',head:true})},
APPLY={news:r=>S.news=r.data||[],releases:r=>S.releases=r.data||[],settings:r=>S.hero={...S.hero,...r.data?.value},posts:r=>S.posts=r.data||[],profiles:r=>S.members=r.count||0},
S={got:{},news:[],releases:[],posts:[],members:0,open:new Set(),cat:'',sort:'new',mf:'',lim:15,
hero:{title:'PULSE',sub:'네 번째 미니앨범',date:'2026-11-03',blurb:'향기 콘셉트를 이어가는 리센느의 새로운 컴백.'}},
sb=!/YOUR-/.test(CFG.url+CFG.key)&&window.supabase?.createClient(CFG.url,CFG.key);
let raf,tt;const dl={};

const route=()=>{const h=location.hash.slice(1);return ROUTES.includes(h)?h:'home'},
uid=()=>S.user?.id,
toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3500)},
msg=e=>ERR.find(([r])=>r.test((e.message||'')+(e.code||'')))?.[1]||'요청을 처리하지 못했어요. 다시 시도해 주세요.',
paint=()=>raf||=requestAnimationFrame(()=>{raf=0;draw()}),
load=async t=>{const r=await Q[t]();if(r.error)return toast(msg(r.error));APPLY[t](r);S.got[t]=1;paint()},
later=t=>{clearTimeout(dl[t]);dl[t]=setTimeout(()=>load(t),250)},
go=async(q,t)=>{const{error}=await q;if(error)toast(msg(error));t&&load(t);return!error},
need=()=>S.me||(toast(S.user?'프로필을 불러오는 중이에요.':'로그인이 필요해요.'),!S.user&&sheet(authForm('in')),0),
empty=(k,t)=>`<p class="dim">${S.got[k]?t:'불러오는 중…'}</p>`,
setup=()=>`<div class="gate"><h3>데이터베이스 연결이 필요해요</h3><p class="dim">index.html 위쪽의 CFG에 Supabase 주소와 키를 입력해 주세요. 방법은 파일 맨 위 주석에 있어요.</p></div>`,
arm=b=>b.dataset.arm?1:(b.dataset.arm=1,b.textContent='한 번 더 눌러 삭제',setTimeout(()=>{b.dataset.arm='';b.textContent='삭제'},3e3),0),
link=u=>/^https:\/\//.test(u||'')?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">기사 보기</a>`:'';

const newsRow=(n,adm)=>`<article class="row"><time class="mono">${fd(n.date)}</time><div><span class="tag">${esc(n.tag)}</span><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p>${link(n.url)}${adm?`<button class="lnk" data-a="deln" data-v="${n.id}">삭제</button>`:''}</div></article>`,
relRow=r=>{const up=r.date>today();return `<article class="row"><time class="mono">${esc(r.dl||fd(r.date))}</time><div><div>${up?'<span class="tag f">발매 예정</span>':''}<span class="tag n">${KIND[r.kind]?.[0]||''}</span></div><h3>${esc(r.title)}</h3>${r.note?`<p>${esc(r.note)}</p>`:''}${r.tracks?.length?`<p class="tr">수록곡 · ${r.tracks.map(esc).join(' · ')}</p>`:''}</div></article>`};

const vHome=()=>{
const h=S.hero,n=dd(h.date),lab=isNaN(n)?'':n>0?'D-'+n:n?'D+'+-n:'D-DAY',t=today();
return `<div class="hero"><p class="eye">${n>0?'NEXT RELEASE':n===0?'RELEASE DAY':'NEW RELEASE'}</p><h1>${esc(h.title)}</h1>
<div class="hrow"><p>${esc(h.sub)} · ${fd(h.date)}<br><span class="dim">${esc(h.blurb)}</span></p>${lab?`<div class="dd">${lab}</div>`:''}</div>
<svg class="pl" viewBox="0 0 1000 56" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" vector-effect="non-scaling-stroke" d="M0 28H380l14-14 14 28 18-40 18 52 16-34 12 8H1000"/></svg></div>
${sb?`<section class="sec"><div class="sh"><h2>최신 소식</h2><a href="#news">전체 보기</a></div>${S.news.slice(0,3).map(x=>newsRow(x)).join('')||empty('news','아직 소식이 없어요.')}</section>
<section class="sec"><div class="sh"><h2>최근 발매</h2><a href="#music">디스코그래피</a></div>${S.releases.filter(r=>r.date<=t).slice(0,3).map(relRow).join('')||empty('releases','아직 정보가 없어요.')}</section>
<section class="sec"><div class="sh"><h2>커뮤니티</h2><a href="#board">커뮤니티 가기</a></div><div class="stat"><div><b>${S.members}</b><span class="dim">회원</span></div><div><b>${S.posts.length}</b><span class="dim">게시글</span></div></div></section>`:setup()}`};

const vNews=()=>!sb?setup():`<div class="sh"><h2>소식</h2>${S.admin?'<button class="btn g" data-a="nform">새 소식 쓰기</button>':''}</div>${S.news.map(n=>newsRow(n,S.admin)).join('')||empty('news','아직 소식이 없어요.')}`;

const vMusic=()=>{if(!sb)return setup();
const F=[['','전체'],['a','앨범'],['s','싱글'],['j','일본']];
return `<div class="sh"><h2>디스코그래피</h2></div><div class="ctl">${F.map(([v,t])=>`<button class="chip" aria-pressed="${S.mf===v}" data-a="mf" data-v="${v}">${t}</button>`).join('')}</div>${S.releases.filter(r=>!S.mf||KIND[r.kind]?.[1]===S.mf).map(relRow).join('')||empty('releases','아직 정보가 없어요.')}`};

const vMembers=()=>`<div class="sh"><h2>RESCENE</h2></div><p>더뮤즈엔터테인먼트의 첫 걸그룹. 2024년 3월 26일 데뷔한 5인조로, 앨범마다 하나의 향기를 콘셉트로 삼아요.</p><div class="mem">${MEM.map(m=>`<div><b>${m[0]}</b><span>${m[1]}</span>${m[2]?`<small>${m[2]}</small>`:''}</div>`).join('')}</div>`;

const vBoard=()=>{if(!sb)return setup();
const me=uid(),ps=S.posts.filter(p=>!S.cat||p.cat===S.cat).sort(S.sort==='top'?(a,b)=>b.likes.length-a.likes.length||b.created_at.localeCompare(a.created_at):(a,b)=>b.created_at.localeCompare(a.created_at));
const post=p=>{const del=p.user_id===me||S.admin,on=p.likes.some(l=>l.user_id===me),cs=[...p.comments].sort((a,b)=>a.created_at.localeCompare(b.created_at));
return `<article class="post"><div class="meta"><b>${esc(p.profiles?.nick||'탈퇴한 회원')}</b><span>${ago(Date.parse(p.created_at))}</span><span class="tag">${esc(p.cat)}</span></div><h3>${esc(p.title)}</h3><p class="bd">${esc(p.body)}</p>
<div class="acts"><button class="${on?'on':''}" data-a="like" data-v="${p.id}" aria-pressed="${on}"><svg viewBox="0 0 24 24"><path d="M12 20.5s-8-4.9-8-10.6A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8 2.6c0 5.7-8 10.6-8 10.6z"/></svg>추천 ${p.likes.length}</button><button data-a="cm" data-v="${p.id}">댓글 ${cs.length}</button>${del?`<button data-a="delp" data-v="${p.id}">삭제</button>`:''}</div>
${S.open.has(p.id)?`<div class="cms">${cs.map(c=>`<div class="cm"><b>${esc(c.profiles?.nick||'탈퇴한 회원')}</b>${esc(c.body)}<small>${ago(Date.parse(c.created_at))}</small>${c.user_id===me||S.admin?` <button class="lnk" data-a="delc" data-v="${c.id}">삭제</button>`:''}</div>`).join('')}
${S.me?`<form class="cf" data-k="${p.id}"><input id="ci-${p.id}" data-cin="${p.id}" maxlength="300" placeholder="댓글을 남겨 보세요" autocomplete="off" aria-label="댓글"><button class="btn">등록</button></form>`:'<p class="dim">로그인하면 댓글을 쓸 수 있어요.</p>'}</div>`:''}</article>`};
return `<div class="sh"><h2>커뮤니티</h2>${S.me?'<button class="btn" data-a="write">글쓰기</button>':'<button class="btn" data-a="auth" data-v="in">로그인하고 글쓰기</button>'}</div>
<div class="ctl">${['',...CATS].map(c=>`<button class="chip" aria-pressed="${S.cat===c}" data-a="cat" data-v="${c}">${c||'전체'}</button>`).join('')}<span class="sp"></span>${[['new','최신순'],['top','추천순']].map(([v,t])=>`<button class="chip" aria-pressed="${S.sort===v}" data-a="sort" data-v="${v}">${t}</button>`).join('')}</div>
<div class="feed">${ps.slice(0,S.lim).map(post).join('')||empty('posts','첫 글을 남겨 보세요.')}</div>${ps.length>S.lim?'<p style="margin-top:16px"><button class="btn g" data-a="more">더 보기</button></p>':''}`};

const V={home:vHome,news:vNews,music:vMusic,members:vMembers,board:vBoard};

const acct=()=>!sb||!S.init?'':S.me?`<button class="who" data-a="me">${S.admin?'<span class="tag f">관리</span>':''}${esc(S.me.nick)}</button>`:S.user?'':'<button class="btn g" data-a="auth" data-v="in">로그인</button><button class="btn" data-a="auth" data-v="up">회원가입</button>';

function draw(){
const r=route();
$('#acct').innerHTML=acct();
$$('main>section').forEach(s=>s.hidden=s.id!=='p-'+r);
$$('nav a').forEach(a=>a.hash==='#'+r?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
$('#nf').hidden=!(S.admin&&S.nform&&r==='news');
$('#pf').hidden=!(S.me&&S.compose&&r==='board');
const a=document.activeElement;
if(a?.tagName==='INPUT'&&a.value&&a.closest('#v-board')){S.dirty=1;return}
const f=a?.dataset?.cin;
$('#v-'+r).innerHTML=V[r]();
if(f)$(`[data-cin="${CSS.escape(f)}"]`)?.focus();
}

const RULES='<ul class="rules"><li>멤버와 다른 팬을 존중해 주세요.</li><li>사생활 침해, 비방, 불법 촬영물 공유는 금지예요.</li><li>유출·불법 음원 링크는 올리지 않아요.</li></ul>',
authForm=m=>{const up=m==='up';return `<h2>${up?'회원가입':'로그인'}</h2>
<form id="af" data-m="${m}"><label for="ae">이메일<input id="ae" name="e" type="email" required autocomplete="email"></label>
<label for="ap">비밀번호 (6자 이상)<input id="ap" name="p" type="password" minlength="6" required autocomplete="${up?'new-password':'current-password'}"></label>
${up?`<label for="an">닉네임 (2~12자)<input id="an" name="n" maxlength="12" required autocomplete="off"></label>${RULES}<label class="ck" for="ak"><input id="ak" name="k" type="checkbox">이용 규칙에 동의합니다</label>`:''}
<div class="btns"><button class="btn">${up?'가입하기':'로그인'}</button><button type="button" class="btn g" data-a="close">닫기</button></div></form>
<p class="dim">${up?'이미 회원이신가요?':'처음이신가요?'} <button class="lnk" data-a="auth" data-v="${up?'in':'up'}">${up?'로그인':'회원가입'}</button></p>`},
profForm=()=>`<h2>프로필</h2><p class="dim">${esc(S.user.email)}</p>
<form id="jf"><label for="jn">닉네임 (2~12자)<input id="jn" name="n" value="${esc(S.me.nick)}" maxlength="12" required autocomplete="off"></label><div class="btns"><button class="btn">저장</button><button type="button" class="btn g" data-a="close">닫기</button></div></form>
<hr><div class="btns"><button class="btn g" data-a="logout">로그아웃</button><button class="lnk" data-a="leave">회원 탈퇴 (계정과 모든 글 삭제)</button></div>`,
sheet=h=>{$('#sheet').hidden=!h;if(h){$('#sp').innerHTML=h;$('#sp').querySelector('input,button')?.focus()}};

document.addEventListener('click',e=>{
if(e.target.id==='sheet')return sheet();
const b=e.target.closest('[data-a]');if(!b)return;
const a=b.dataset.a,v=b.dataset.v;
({auth:()=>sheet(authForm(v)),me:()=>sheet(profForm()),close:()=>sheet(),
logout:()=>{sb.auth.signOut();sheet();toast('로그아웃했어요.')},
write:()=>{if(need()){S.compose=!S.compose;draw()}},
nform:()=>{S.nform=!S.nform;$('#nd').value||=today();draw()},
like:()=>{if(!need())return;const p=S.posts.find(p=>p.id==v),had=p.likes.some(l=>l.user_id===uid());
p.likes=had?p.likes.filter(l=>l.user_id!==uid()):[...p.likes,{user_id:uid()}];paint();
go(had?sb.from('likes').delete().match({post_id:p.id,user_id:uid()}):sb.from('likes').insert({post_id:p.id}),'posts')},
cm:()=>{S.open.has(+v)?S.open.delete(+v):S.open.add(+v);paint()},
delp:()=>arm(b)&&go(sb.from('posts').delete().eq('id',v),'posts'),
delc:()=>arm(b)&&go(sb.from('comments').delete().eq('id',v),'posts'),
deln:()=>arm(b)&&go(sb.from('news').delete().eq('id',v),'news'),
more:()=>{S.lim+=15;paint()},cat:()=>{S.cat=v;S.lim=15;paint()},sort:()=>{S.sort=v;paint()},mf:()=>{S.mf=v;paint()},
leave:async()=>{if(!arm(b))return;if(await go(sb.rpc('delete_me'))){await sb.auth.signOut();sheet();toast('탈퇴 처리했어요.')}}
})[a]?.();
});

document.addEventListener('submit',async e=>{
e.preventDefault();const f=e.target,x=new FormData(f),g=k=>String(x.get(k)||'').trim();
if(f.id==='af'){const up=f.dataset.m==='up',n=g('n');
if(up&&!NICK.test(n))return toast('닉네임은 한글·영문·숫자 2~12자로 입력해 주세요.');
if(up&&!x.get('k'))return toast('이용 규칙에 동의해 주세요.');
const{data,error}=up?await sb.auth.signUp({email:g('e'),password:x.get('p'),options:{data:{nick:n}}}):await sb.auth.signInWithPassword({email:g('e'),password:x.get('p')});
if(error)return toast(msg(error));
sheet();toast(!up?'로그인했어요.':data.session?'가입을 환영해요!':'인증 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.')}
else if(f.id==='jf'){const n=g('n');if(!NICK.test(n))return toast('닉네임은 한글·영문·숫자 2~12자로 입력해 주세요.');
if(await go(sb.from('profiles').update({nick:n}).eq('id',uid()),'posts')){await loadMe();sheet();toast('저장했어요.')}}
else if(f.id==='pf'&&need()){
if(await go(sb.from('posts').insert({cat:g('c'),title:g('t').slice(0,60),body:g('b').slice(0,1500)}),'posts')){f.reset();S.compose=false;S.sort='new';draw()}}
else if(f.id==='nf'&&S.admin){
if(await go(sb.from('news').insert({tag:g('g'),title:g('t'),body:g('b'),url:g('u')||null,date:g('d')}),'news')){f.reset();S.nform=false;draw()}}
else if(f.classList.contains('cf')&&need()){const i=f.querySelector('input'),b=i.value.trim().slice(0,300);if(!b)return;
i.value='';S.dirty=0;await go(sb.from('comments').insert({post_id:+f.dataset.k,body:b}),'posts')}
});

document.addEventListener('keydown',e=>e.key==='Escape'&&sheet());
document.addEventListener('focusout',()=>S.dirty&&setTimeout(()=>{S.dirty=0;paint()},400));
addEventListener('hashchange',()=>{scrollTo(0,0);paint()});

async function loadMe(){
const r=S.user?await sb.from('profiles').select('*').eq('id',uid()).maybeSingle():{};
S.me=r.data||null;S.admin=!!r.data?.is_admin;S.init=1;paint()}

$('#ng').innerHTML=TAGS.map(t=>`<option>${t}</option>`).join('');
$('#pc').innerHTML=CATS.map(t=>`<option>${t}</option>`).join('');
paint();

if(sb){
sb.auth.onAuthStateChange((_,s)=>{S.user=s?.user||null;setTimeout(loadMe)});
Object.keys(Q).forEach(load);
sb.channel('live').on('postgres_changes',{event:'*',schema:'public'},p=>{
const t=p.table;later(t==='comments'||t==='likes'||t==='profiles'?'posts':t);t==='profiles'&&later('profiles')}).subscribe();
}
</script>
</body>
</html>
